{% extends 'blog/base.html' %}
{% load crispy_forms_tags %}
{% block title %}Sign Up | MyBlog{% endblock %}
{% block content %}
<div class="row justify-content-center">
	<div class="col-lg-7 col-xl-6">
		<div class="surface-card p-4 p-lg-5">
			<h1 class="h2 section-heading mb-2">Create Account</h1>
			<p class="text-secondary mb-4">Join the blog to like posts, comment, and write your own content.</p>
			<form method="post">
				{% csrf_token %}
				{{ form|crispy }}
				<button class="btn btn-brand w-100 mt-2" type="submit">Sign Up</button>
			</form>
			<div class="text-center mt-3 text-secondary">
				Already registered? <a href="{% url 'login' %}">Login</a>
			</div>
		</div>
	</div>
</div>
{% endblock %}
